<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"

  <body>
     <header>
      <nav class="navbar bg-primary text-light px-5">
        <div class="navbar-brand text-light fw-bold">To-Do Application</div>
      </nav>
    </header>

    <main>
      <section class="container p-3 border rounded shadow mt-3 d-flex gap-4">
        <input
          type="text"
          name="task"
          id="taskinput"
          placeholder="Add your task"
          class="form-control"
        />
        <button class="btn btn-primary text-nowrap" onclick="addtask()">
          Add Your Task
        </button>
      </section>

      <section class="container p-3 border rounded shadow mt-3 d-flex gap-4">
        <ol class="w-100" id="taskList">
              </ol>
      </section>
    </main>






























   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
