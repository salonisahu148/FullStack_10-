<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic and syntax</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="kuchbhi">Sample Heading</h1>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Doloribus soluta
      voluptatem, assumenda consequuntur, consequatur molestias sunt provident
      maiores pariatur neque ipsum dicta nostrum ullam rem nemo minima tempora?
      Explicabo, inventore?
    </p>
    <!-- class selector -->
    <div>
      <label for="fullname" class="kuchbhi">Your Name:</label>
      <input
        type="text"
        name="fullname"
        id="fullname"
        placeholder="your name"
        class="kuchbhi"
      />
      <br />
      <!--id selector  -->
      <button class="kuchbhi" id="submitbutton">submit</button>
      <!-- inline css -->
      <button class="kuchbhi" style="background-color: rgb(249, 113, 113);">submit</button>
    </div>
  </body>
</html>
