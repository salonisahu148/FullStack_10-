<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/userlogin.css">
</head>
<body>
     <header>
      <div id="navigation-bar">
        <div>
          <a href="" id="brand-name">Furni.</a>
        </div>
        <div id="menu-item">
          <div id="menu-name">
            <a href="../HTML/home.html" class="menu">Home</a>
            <a href="../HTML/shop.html" class="menu">Shop</a>
            <a href="../HTML/aboutus.html" class="menu">About us</a>
            <a href="../HTML/services.html" class="menu">Services</a>
            <a href="../HTML/blog.html" class="menu">Blog</a>
            <a href="../HTML/contactus.html" class="menu">Contact us</a>
          </div>

          <div id="icons">
              <a  href="../HTML/userlogin.html">  <img src="../assets/user.svg" alt="user" id="cart" /></a>
            <img src="../assets/cart.svg" alt="cart logo" id="cart" />
          </div>
        </div>
      </div>
    </header>
   
     
      <section id="hero">
        <div>
         
        <div id="main">
      <div class="login-container">
        <h2>Login</h2>

        <form id="form">
          <div class="input-box">
            <i class="fa-regular fa-envelop"></i>
            <input type="email" placeholder=" Enter your email" />
          </div>

          <div class="input-box">
            <input type="password" placeholder="confirm a password" />
          </div>

          <div id="extra">
            <div>
              <input
                type="checkbox"
                name="rememberme"
                id="rememberme"
                value="rememberme"
              />
              <label for="rememberme">Remember me</label>
            </div>

            <div class="forgot">
              <a href="">Forgot Password?</a>
            </div>
          </div>

          <button class="login-btn">Login Now</button>
        </form>

        <div class="signup">
          <div>Don't have an account?</div>
          <div><a href="../HTML/signup.html">Sign Up</a></div>
        </div>
      </div>
      <div><img src="../assets/couch.png" alt="couch" id="couch" /></div>
      </section>
</body>
