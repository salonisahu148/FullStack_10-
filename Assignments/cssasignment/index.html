<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css assignment</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <div class="login-container">
        <h2>Login</h2>

        <form id="form">
          <div class="input-box">
            <input type="email" placeholder="#& Enter your email" />
          </div>

          <div class="input-box">
            <input type="password" placeholder="confirm a password" />
          </div>

          <div id="extra">
            <div>
              <input
                type="checkbox"
                name="rememberme"
                id="rememberme"
                value="rememberme"
              />
              <label for="rememberme">Remember me</label>
            </div>

            <div class="forgot">
              <a href="">Forgot Password?</a>
            </div>
          </div>

          <button class="login-btn">Login Now</button>
        </form>

        <div class="signup">
          <div>Don't have an account?</div>
          <div><a href="#">Sign Up</a></div>
        </div>
      </div>
      <div class="registration-container">
        <h2>Registration</h2>
        <form>
          <div class="input-box">
            <input type="text" placeholder="Enter your name" />
          </div>
          <div class="input-box">
            <input type="email" placeholder="enter your email" />
          </div>
          <div class="input-box">
            <input type="password" placeholder="create password" />
          </div>
          <div class="input-box">
            <input type="password" placeholder="confirm password" />
          </div>

          <div id="extra">
            <div><input
              type="checkbox"
              value="termsandpolicy"
              name="termsandpolicy"
              id="termsandpolicy"
            />
            <label for="termsandpolicy">I accept all terms and policy</label>
          </div>
         </div> 

          <button class="login-btn">register now</button>
        </form>
        <div class="signup">
          <div>Already have an account?</div>
          <div><a href="#">Login now</a></div>
        </div>
      </div>
    </div>
  </body>
</html>
