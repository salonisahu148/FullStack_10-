<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>task 4</h1>

    <table border="1" width="900px">
      <tr>
        <th align="center" rowspan="2" colspan="5">Registration Form</th>
      </tr>
      <tr></tr>
      <br />
      <tr>
        <td><label for="studentname">Student Name</label></td>
        <td>
          <input
            type="text"
            name="studentname"
            id="firstname"
            placeholder="firstname"
          />
        </td>
        <td>
          <input
            type="text"
            name="studentname"
            id="middlename"
            placeholder="middlename"
          />
        </td>
        <td>
          <input
            type="text"
            name="studentname"
            id="lastname"
            placeholder="lastname"
          />
        </td>
      </tr>
      <br />
      <tr>
        <td><label for="fathersname">Fathers Name:</label></td>
        <td>
          <input
            type="text"
            name="fathersname"
            id="fathersname"
            placeholder="fathersname"
          />
        </td>
        <td><label for="mothersname">Mohers Name:</label></td>
        <td>
          <input
            type="text"
            name="mothersname"
            id="mothersname"
            placeholder="mothersname"
          />
        </td>
      </tr>
      <tr>
        <td><label for="dob">Date Of Birth</label></td>
        <td><input type="date" name="dob" id="dob" /></td>
        <td><label for="gender">Gender</label></td>
        <td>
          <input type="radio" name="gender" id="male" value="male" />
          <span>Male</span>
          <input type="radio" name="gender" id="female" value="female" />
          <span>Female</span>
        </td>
      </tr>
      <tr>
        <td><label for="category">Category</label></td>
        <td>
          <input type="radio" name="category" id="gen" value="gen" />
          <span>Gen</span>
          <input type="radio" name="category" id="OBC" value="OBC" />
          <span>OBC</span>
          <input type="radio" name="category" id="SC/ST" value="SC/ST" />
          <span>SC/ST</span>
        </td>
        <td><label for="handicapped">Handicapped</label></td>
        <td>
          <input type="radio" name="handicapped" id="yes" value="yes" />
          <span>Yes</span>
          <input type="radio" name="handicapped" id="no" value="no" />
          <span>No</span>
        </td>
      </tr>
      <tr>
        <td><label for="exservicemen">Ex-Servicemen</label></td>
        <td>
          <input type="radio" name="exservicemen" id="yes" value="yes" />
          <span>Yes</span>
          <input type="radio" name="exservicemen" id="no" value="no" />
          <span>No</span>
        </td>
        <td><label for="ews">EWS</label></td>
        <td>
          <input type="radio" name="ews" id="yes" value="yes" />
          <span>Yes</span>
          <input type="radio" name="ews" id="no" value="no" />
          <span>No</span>
        </td>
      </tr>
      <tr>
        <td><label for="email">Email ID</label></td>
        <td><input type="email" name="email" id="emaail" /></td>
        <td><label for="number">Mobile No.</label></td>
        <td><input type="number" name="number" id="number" min="0" /></td>
      </tr>
      <tr>
        <td><label for="state">State</label></td>
        <td>
          <select name="state" id="state">
            <option value="">--Select any one--</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="other">Other</option>
          </select>
        </td>
        <td><label for="city">City</label></td>
        <td>
          <select name="city" id="city">
            <option value="">--Select any one--</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="other">Other</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><label for="photo">Upload photo</label></td>
        <td><input type="file" name="photo" id="photo" /></td>
        <td><label for="signature">Upload Signature</label></td>
        <td><input type="file" name="signature" id="signature" /></td>
      </tr>
      <tr>
        <td></td>
        <td colspan="3" align="center">
          <button>submit</button>
        </td>
      </tr>
    </table> 
     <br><br>

     <button><a href="../formsindex.html">Back to Form Assingments</a></button>
   
    <button><a href="../../index.html">Back to Home</a></button>
</body>
</html>
