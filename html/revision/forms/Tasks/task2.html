<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <fieldset>
      <form>
        <h2>Pizza Order Form</h2>
        <br />
        <label for="firstname">First Name:</label>
        <input type="text" name="Firstname" id="firstname" />
        <br />
        <br />
        <label for="lastname">Last Name:</label>
        <input type="text" name="Last Name" id="lastname" />
        <br /><br />
        <label for="email">Email:</label>
        <input type="email" name="Email" id="email" />
        <br /><br />
        <label for="number">Contact Number:</label>
        <input type="number" name="mobile" id="number" min="0" max="10" />
        <br /><br />
        <label for="dob"> Preferred Delivery Date:</label>
        <input type="date" name="dob" id="dob" />
        <br /><br />
        <label for="size">Size:</label>
        <br /><br />
        <input type="radio" name="size" id="small" value="small" />
        <span>Small</span>
        <input type="radio" name="size" id="medium" value="medium" />
        <span>Medium</span>
        <input type="radio" name="size" id="large" value="large" />
        <span>Large</span>
        <br />
        <br />
        <label for="flavor">Flavor:</label>
        <br /><br />
        <input
          type="checkbox"
          name="flavor"
          id="hawaiian(Php 150.00) "
          value="hawaiian(Php 150.00)"
        />
        <span>hawaiian(Php 150.00)</span>
        <input
          type="number"
          name="hawaiian(Php 150.00)"
          id="hawaiian(Php 150.00)"
          min="0"
        />

        <br />
        <br />
        <input
          type="checkbox"
          name="flavor"
          id="Pepperoni(Php 140.00) "
          value="Pepperoni(Php 140.00)"
        />
        <span>pepporoni(Php 140.00)</span>
        <input
          type="number"
          name="pepporoni(Php 140.00)"
          id="pepporoni(Php 140.00)"
          min="0"
        />

        <br />
        <br />
        <input
          type="checkbox"
          name="flavor"
          id="vegetable(Php 130.00) "
          value="vegetable(Php 130.00)"
        />

        <span>vegetable(Php 130.00)</span>
        <input
          type="number"
          name="vegetable(Php 130.00)"
          id="vegetable(Php 130.00)"
          min="0"
        />
        <br />
        <br />

        <label for="number">Credit Card Number</label>
        <input
          type="number"
          name="creditcardnumber"
          id="number"
          min="0"
          max="10"
        />

        <br />
        <br />
        <label for="number">PIN:</label>
        <input type="number" name="pin" id="number" value="pin" min="0" />
        <br />
        <br />
        <label for="text">Additional Note:</label>
        <br />

        <textarea name="additionalnote" id="additionalnote"></textarea>

        <br />
        <br />
        <button>Submit order</button>
      </form>
    </fieldset>

    <br><br>

     <button><a href="../formsindex.html">Back to Form Assingments</a></button>
   
    <button><a href="../../index.html">Back to Home</a></button>
</body>
</html>
